# fly.toml app configuration file generated for sistema-avaliacao on 2026-10-05T20:46:54-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sistema-avaliacao'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  DATA_PROTECTION_KEYS_PATH = '/data/keys'
  SISTEMA_AVALIACAO_DB = '/data/sistema_avaliacao.db'
  SISTEMA_AVALIACAO_UPLOADS = '/data/uploads'

[[mounts]]
  source = 'sistema_avaliacao_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
