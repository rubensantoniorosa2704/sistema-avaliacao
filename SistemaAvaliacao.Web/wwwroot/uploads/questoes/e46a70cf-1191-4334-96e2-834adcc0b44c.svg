<svg xmlns="http://www.w3.org/2000/svg" width="927.5" height="241" viewBox="0 0 927.5 241" font-family="'Segoe UI',Arial,sans-serif" font-size="14"><rect x="0" y="0" width="927.5" height="241" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="10" y="21" fill="#1f2933" font-weight="600">Risco</text><rect x="290" y="0" width="57.5" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="300" y="21" fill="#1f2933" font-weight="600">Prob.</text><rect x="347.5" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="357.5" y="21" fill="#1f2933" font-weight="600">Efeito na entrega</text><rect x="637.5" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="647.5" y="21" fill="#1f2933" font-weight="600">Dependência / resposta disponível</text><rect x="0" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="54" fill="#1f2933">R1 - alteração no contrato da API de</text><text x="10" y="73" fill="#1f2933">pagamento</text><rect x="290" y="33" width="57.5" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="54" fill="#1f2933">0,40</text><rect x="347.5" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="357.5" y="54" fill="#1f2933">Bloqueia o critério de aceite da</text><text x="357.5" y="73" fill="#1f2933">liberação final</text><rect x="637.5" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="647.5" y="54" fill="#1f2933">Certificação externa; antecedência</text><text x="647.5" y="73" fill="#1f2933">mínima de 3 semanas</text><rect x="0" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="106" fill="#1f2933">R2 - ambiguidade em relatório</text><text x="10" y="125" fill="#1f2933">gerencial</text><rect x="290" y="85" width="57.5" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="106" fill="#1f2933">0,70</text><rect x="347.5" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="357.5" y="106" fill="#1f2933">Reprocessamento interno, sem</text><text x="357.5" y="125" fill="#1f2933">bloquear o fluxo principal</text><rect x="637.5" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="647.5" y="106" fill="#1f2933">Oficina interna; correção estimada</text><text x="647.5" y="125" fill="#1f2933">em 2 dias</text><rect x="0" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="158" fill="#1f2933">R3 - volume de arquivos três vezes</text><text x="10" y="177" fill="#1f2933">maior</text><rect x="290" y="137" width="57.5" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="158" fill="#1f2933">0,50</text><rect x="347.5" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="357.5" y="158" fill="#1f2933">Pode degradar o tempo de envio e</text><text x="357.5" y="177" fill="#1f2933">validação</text><rect x="637.5" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="647.5" y="158" fill="#1f2933">Teste de carga e escalonamento</text><text x="647.5" y="177" fill="#1f2933">disponíveis</text><rect x="0" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="210" fill="#1f2933">R4 - atraso na revisão dos textos da</text><text x="10" y="229" fill="#1f2933">interface</text><rect x="290" y="189" width="57.5" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="210" fill="#1f2933">0,60</text><rect x="347.5" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="357.5" y="210" fill="#1f2933">Impacto baixo e isolado na</text><text x="357.5" y="229" fill="#1f2933">experiência</text><rect x="637.5" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="647.5" y="210" fill="#1f2933">Aprovação interna; sem dependência</text><text x="647.5" y="229" fill="#1f2933">técnica crítica</text></g></svg>