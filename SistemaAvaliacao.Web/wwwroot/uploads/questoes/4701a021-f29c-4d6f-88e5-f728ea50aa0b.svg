<svg xmlns="http://www.w3.org/2000/svg" width="290" height="90" viewBox="0 0 290 90" font-family="'Segoe UI',Arial,sans-serif" font-size="14"><rect x="0" y="0" width="290" height="90" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="290" height="90" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="10" y="21" fill="#1f2933" font-weight="600">entrada = requisicao.email sql =</text><text x="10" y="40" fill="#1f2933" font-weight="600">&quot;SELECT id, nome FROM usuario WHERE</text><text x="10" y="59" fill="#1f2933" font-weight="600">email = &apos;&quot; + entrada + &quot;&apos;&quot; resultado</text><text x="10" y="78" fill="#1f2933" font-weight="600">= executar(sql)</text></g></svg>