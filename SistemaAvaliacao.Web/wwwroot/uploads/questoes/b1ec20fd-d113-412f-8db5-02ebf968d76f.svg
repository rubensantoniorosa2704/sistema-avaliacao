<svg xmlns="http://www.w3.org/2000/svg" width="870" height="241" viewBox="0 0 870 241" font-family="'Segoe UI',Arial,sans-serif" font-size="14"><rect x="0" y="0" width="870" height="241" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="10" y="21" fill="#1f2933" font-weight="600">Requisito/risco</text><rect x="290" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="300" y="21" fill="#1f2933" font-weight="600">Histórico ou condição</text><rect x="580" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="590" y="21" fill="#1f2933" font-weight="600">Evidência necessária</text><rect x="0" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="54" fill="#1f2933">R1 - cobrar uma única vez por pedido</text><text x="10" y="73" fill="#1f2933">(crítico)</text><rect x="290" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="54" fill="#1f2933">Houve cobrança duplicada após</text><text x="300" y="73" fill="#1f2933">timeout e repetição.</text><rect x="580" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="590" y="54" fill="#1f2933">Integração sob timeout, repetição e</text><text x="590" y="73" fill="#1f2933">mesma chave de operação.</text><rect x="0" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="106" fill="#1f2933">R2 - calcular quatro regras de</text><text x="10" y="125" fill="#1f2933">desconto (alto)</text><rect x="290" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="106" fill="#1f2933">Defeitos ocorreram em limites e</text><text x="300" y="125" fill="#1f2933">combinações.</text><rect x="580" y="85" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="590" y="106" fill="#1f2933">Testes unitários de fronteira e</text><text x="590" y="125" fill="#1f2933">combinações válidas.</text><rect x="0" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="158" fill="#1f2933">R3 - confirmar pagamento com teclado</text><text x="10" y="177" fill="#1f2933">(médio)</text><rect x="290" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="158" fill="#1f2933">Foco ficou preso em componente</text><text x="300" y="177" fill="#1f2933">modal.</text><rect x="580" y="137" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="590" y="158" fill="#1f2933">Percurso por teclado e anúncio de</text><text x="590" y="177" fill="#1f2933">estado ao usuário.</text><rect x="0" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="210" fill="#1f2933">R4 - preservar meios de pagamento</text><text x="10" y="229" fill="#1f2933">existentes (alto)</text><rect x="290" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="300" y="210" fill="#1f2933">Nova integração já quebrou meio</text><text x="300" y="229" fill="#1f2933">anterior.</text><rect x="580" y="189" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="590" y="210" fill="#1f2933">Regressão automatizada dos fluxos já</text><text x="590" y="229" fill="#1f2933">liberados.</text></g></svg>