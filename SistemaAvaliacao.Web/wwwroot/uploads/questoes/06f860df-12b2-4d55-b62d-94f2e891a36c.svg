<svg xmlns="http://www.w3.org/2000/svg" width="290" height="109" viewBox="0 0 290 109" font-family="'Segoe UI',Arial,sans-serif" font-size="14"><rect x="0" y="0" width="290" height="109" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="290" height="109" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="10" y="21" fill="#1f2933" font-weight="600">total &lt;- 0 pendentes &lt;- 3 para i de</text><text x="10" y="40" fill="#1f2933" font-weight="600">1 até 4 faça se i mod 2 = 0 então</text><text x="10" y="59" fill="#1f2933" font-weight="600">total &lt;- total + pendentes senão</text><text x="10" y="78" fill="#1f2933" font-weight="600">pendentes &lt;- pendentes + 1 fim-se</text><text x="10" y="97" fill="#1f2933" font-weight="600">fim-para escreva(total, pendentes)</text></g></svg>