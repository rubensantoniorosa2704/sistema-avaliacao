<svg xmlns="http://www.w3.org/2000/svg" width="520" height="189" viewBox="0 0 520 189" font-family="'Segoe UI',Arial,sans-serif" font-size="14"><rect x="0" y="0" width="520" height="189" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="230" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="10" y="21" fill="#1f2933" font-weight="600">Evidência</text><rect x="230" y="0" width="290" height="33" fill="#eef2f7" stroke="#c9ced6" stroke-width="1"/><text x="240" y="21" fill="#1f2933" font-weight="600">Critério de avaliação</text><rect x="0" y="33" width="230" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="54" fill="#1f2933">Porta fechada e sinalizada</text><rect x="230" y="33" width="290" height="52" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="240" y="54" fill="#1f2933">Manter controle de acesso e</text><text x="240" y="73" fill="#1f2933">sinalização de risco.</text><rect x="0" y="85" width="230" height="33" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="106" fill="#1f2933">Condutor de proteção: 0,18 Ω</text><rect x="230" y="85" width="290" height="33" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="240" y="106" fill="#1f2933">Máximo do projeto: 0,50 Ω.</text><rect x="0" y="118" width="230" height="71" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="10" y="139" fill="#1f2933">Dano superficial no borne L3</text><rect x="230" y="118" width="290" height="71" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="240" y="139" fill="#1f2933">Registrar condição e definir</text><text x="240" y="158" fill="#1f2933">tratamento proporcional, responsável</text><text x="240" y="177" fill="#1f2933">e prazo.</text></g></svg>